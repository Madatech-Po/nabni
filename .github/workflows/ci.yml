name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push cancels an older run of the same branch or PR, except on main: there a run may be
# deploying, and cancelling it would leave production half-deployed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tests mock Supabase and the build never calls it, so placeholders are enough.
    # Database permission tests (supabase/tests/permissions.sql) are run manually.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # UI tests (epic NAB-68) against the live Supabase project with the e2e accounts.
  # They need repository secrets; without them the job is skipped with a warning.
  # A paused free-tier project makes this job fail until it is restored.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_PARENT_EMAIL: ${{ secrets.E2E_PARENT_EMAIL }}
      E2E_PARENT_PASSWORD: ${{ secrets.E2E_PARENT_PASSWORD }}
      E2E_EDUCATOR_EMAIL: ${{ secrets.E2E_EDUCATOR_EMAIL }}
      E2E_EDUCATOR_PASSWORD: ${{ secrets.E2E_EDUCATOR_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check the e2e secrets are set
        id: secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::UI tests skipped: add the NEXT_PUBLIC_SUPABASE_* and E2E_* repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      # CI=true: Playwright builds the app and serves the production build.
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run test:e2e
      - if: failure() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Deploys main to Cloudflare Workers with OpenNext (NAB-127, see DEPLOYMENT.md) once the
  # checks and UI tests pass. The NEXT_PUBLIC_* values are inlined into the build here.
  # Without the Cloudflare secrets the job is skipped with a warning.
  deploy:
    # Deploys are paused until the Gulf launch (NAB-149): set the repository variable
    # DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables) to turn them on.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check the deploy secrets are set
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Deploy skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see DEPLOYMENT.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Deploy skipped: add the NEXT_PUBLIC_SUPABASE_* repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      # Builds with OpenNext, then uploads the worker and its assets (wrangler deploy).
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run deploy
